
name: Publish VoiceOps container images

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/publish-images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Normalize GitHub owner
        id: owner
        shell: bash
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Django backend
        id: backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/voiceops-backend:latest
            ghcr.io/${{ steps.owner.outputs.name }}/voiceops-backend:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push React frontend
        id: frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          build-args: |
            VITE_API_BASE_URL=/api
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/voiceops-frontend:latest
            ghcr.io/${{ steps.owner.outputs.name }}/voiceops-frontend:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Print exact published image references
        shell: bash
        run: |
          echo "=== BACKEND ==="
          echo "Tag: ghcr.io/${{ steps.owner.outputs.name }}/voiceops-backend:sha-${{ github.sha }}"
          echo "Digest: ghcr.io/${{ steps.owner.outputs.name }}/voiceops-backend@${{ steps.backend.outputs.digest }}"
          echo "=== FRONTEND ==="
          echo "Tag: ghcr.io/${{ steps.owner.outputs.name }}/voiceops-frontend:sha-${{ github.sha }}"
          echo "Digest: ghcr.io/${{ steps.owner.outputs.name }}/voiceops-frontend@${{ steps.frontend.outputs.digest }}"